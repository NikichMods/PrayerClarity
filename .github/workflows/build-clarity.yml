name: Build PrayerClarity candidate

on:
  workflow_dispatch:
  push:
    branches:
      - 'candidate/**'
      - '!candidate/rebalanced-*'
    paths:
      - 'src/**'
      - 'lang/**'
      - '*.csproj'
      - '.github/workflows/build-clarity.yml'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: prayerclarity-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate production change gate
        run: python scripts/validate_candidate_gate.py
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(dotnet msbuild PrayerClarity.csproj -nologo -getProperty:Version | tr -d '\r' | tail -n 1)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Validate localization contracts
        run: python scripts/validate_localization.py lang
      - name: Restore
        run: dotnet restore PrayerClarity.csproj
      - name: Build Release DLL
        run: dotnet build PrayerClarity.csproj -c Release --no-restore
      - name: Verify locales and stage release-identical artifacts
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          dll='bin/Release/PrayerClarity.dll'
          test -f "$dll"
          for locale in en fr de zh_cn es pt_br ko ja ru it pl; do
            grep -a -q ".lang.${locale}.json" "$dll" || {
              echo "Embedded locale marker missing: ${locale}" >&2
              exit 1
            }
          done

          mkdir -p dist/package/BepInEx/plugins/PrayerClarity
          version='${{ steps.version.outputs.value }}'
          handoff="PrayerClarity-${version}-ci.dll"
          canonical='PrayerClarity.dll'
          nexus="PrayerClarity-${version}-Nexus.zip"

          cp "$dll" "dist/$handoff"
          cp "$dll" "dist/$canonical"
          cp "$dll" "dist/package/BepInEx/plugins/PrayerClarity/$canonical"
          (cd dist/package && zip -qr "../$nexus" BepInEx)

          dll_hash=$(sha256sum "dist/$handoff" | awk '{print $1}')
          canonical_hash=$(sha256sum "dist/$canonical" | awk '{print $1}')
          nexus_hash=$(sha256sum "dist/$nexus" | awk '{print $1}')
          test "$dll_hash" = "$canonical_hash"

          {
            echo "Version: $version"
            echo "Source SHA: $GITHUB_SHA"
            echo "Handoff DLL: $handoff"
            echo "Canonical DLL: $canonical"
            echo "DLL SHA-256: $dll_hash"
            echo "Nexus package: $nexus"
            echo "Nexus ZIP SHA-256: $nexus_hash"
            echo "Supported game MVID: 6f50b8e7-156b-49ac-bbe8-7505894b2364"
            echo "Locales: en fr de zh_cn es pt_br ko ja ru it pl"
          } > dist/BUILD_INFO.txt

          echo "handoff=$handoff" >> "$GITHUB_OUTPUT"
          echo "canonical=$canonical" >> "$GITHUB_OUTPUT"
          echo "nexus=$nexus" >> "$GITHUB_OUTPUT"
          echo "sha256=$dll_hash" >> "$GITHUB_OUTPUT"
          echo "PrayerClarity $version DLL SHA-256: $dll_hash"
          echo "PrayerClarity $version Nexus ZIP SHA-256: $nexus_hash"
      - name: Upload candidate and release-package evidence
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-${{ steps.version.outputs.value }}-ci-${{ github.sha }}
          path: |
            dist/${{ steps.artifact.outputs.handoff }}
            dist/${{ steps.artifact.outputs.canonical }}
            dist/${{ steps.artifact.outputs.nexus }}
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
