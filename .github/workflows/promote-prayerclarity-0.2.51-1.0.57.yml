name: Publish accepted PrayerClarity 0.2.51 and 1.0.57

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/promote-prayerclarity-0.2.51-1.0.57.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ACCEPTED_SHA: 13c85c824bd2932b1175200368d212e03bbae79f
      REBALANCED_SHA256: 083168ec6cd76fd55366ca10426e212a30a3bc2c7ca61a9e9de0dc6f656c8ccd
      VANILLA_SHA256: 3ff5f830a3ce20d1bf789e5f9ff0d3ac11cf9511d4457660b56c1f286dc31195
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download exact accepted shared artifact
        uses: actions/download-artifact@v4
        with:
          repository: NikichMods/PrayerClarity
          run-id: 36275212482
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: PrayerClarity-rebalanced-0.2.51-ci-13c85c824bd2932b1175200368d212e03bbae79f
          path: accepted

      - name: Verify accepted bytes and stage canonical assets
        shell: bash
        run: |
          set -euo pipefail
          reb='accepted/PrayerClarity.Rebalanced-0.2.51-ci.dll'
          van='accepted/PrayerClarity-1.0.57-ci.dll'
          test -f "$reb"
          test -f "$van"

          test "$(sha256sum "$reb" | awk '{print $1}')" = "$REBALANCED_SHA256"
          test "$(sha256sum "$van" | awk '{print $1}')" = "$VANILLA_SHA256"

          mkdir -p release
          cp "$reb" release/PrayerClarity.Rebalanced.dll
          cp "$van" release/PrayerClarity.dll

          test "$(sha256sum release/PrayerClarity.Rebalanced.dll | awk '{print $1}')" = "$REBALANCED_SHA256"
          test "$(sha256sum release/PrayerClarity.dll | awk '{print $1}')" = "$VANILLA_SHA256"

      - name: Publish Rebalanced 0.2.51 without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          if gh release view rebalanced-v0.2.51 --repo NikichMods/PrayerClarity >/dev/null 2>&1; then
            echo 'rebalanced-v0.2.51 already exists; leaving publication identity unchanged.'
          else
            gh release create rebalanced-v0.2.51 release/PrayerClarity.Rebalanced.dll \
              --repo NikichMods/PrayerClarity \
              --target "$ACCEPTED_SHA" \
              --title 'PrayerClarity: Rebalanced 0.2.51' \
              --latest=false \
              --notes "Accepted PrayerClarity: Rebalanced release for Graveyard Keeper 1.407. Combo Prayer uses +100/+150/+200% Faith and +100/+250/+500% donations. Prayer Technology titles, Base Result, and On Success are centered consistently across mouse and gamepad while mechanics rows remain left-aligned; accepted Repose and prayer-item presentation is preserved. Exact accepted runtime source: $ACCEPTED_SHA. Exact DLL SHA-256: $REBALANCED_SHA256."
          fi

      - name: Publish Vanilla 1.0.57 without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.57 --repo NikichMods/PrayerClarity >/dev/null 2>&1; then
            echo 'v1.0.57 already exists; leaving publication identity unchanged.'
          else
            gh release create v1.0.57 release/PrayerClarity.dll \
              --repo NikichMods/PrayerClarity \
              --target "$ACCEPTED_SHA" \
              --title 'PrayerClarity: Vanilla 1.0.57' \
              --latest=false \
              --notes "Accepted PrayerClarity: Vanilla release for Graveyard Keeper 1.407. Prayer Technology titles, Base Result, and On Success are centered consistently across mouse and gamepad while mechanics rows remain left-aligned. Accepted prayer-item, pulpit, Temporary Effects, localization, and controller-navigation presentation is preserved. Stock prayer mechanics and balance remain unchanged. Exact accepted runtime source: $ACCEPTED_SHA. Exact DLL SHA-256: $VANILLA_SHA256."
          fi

      - name: Verify published release assets and tag targets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify
          mkdir -p verify/rebalanced verify/vanilla

          gh release download rebalanced-v0.2.51 \
            --repo NikichMods/PrayerClarity \
            --pattern 'PrayerClarity.Rebalanced.dll' \
            --dir verify/rebalanced
          gh release download v1.0.57 \
            --repo NikichMods/PrayerClarity \
            --pattern 'PrayerClarity.dll' \
            --dir verify/vanilla

          test "$(sha256sum verify/rebalanced/PrayerClarity.Rebalanced.dll | awk '{print $1}')" = "$REBALANCED_SHA256"
          test "$(sha256sum verify/vanilla/PrayerClarity.dll | awk '{print $1}')" = "$VANILLA_SHA256"

          reb_target=$(gh api repos/NikichMods/PrayerClarity/git/ref/tags/rebalanced-v0.2.51 --jq '.object.sha')
          van_target=$(gh api repos/NikichMods/PrayerClarity/git/ref/tags/v1.0.57 --jq '.object.sha')
          test "$reb_target" = "$ACCEPTED_SHA"
          test "$van_target" = "$ACCEPTED_SHA"
