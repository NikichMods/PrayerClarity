name: Publish accepted Rebalanced 0.2.47

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/promote-rebalanced-0.2.47.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ACCEPTED_SHA: 6b3aa5399c8913d368f2b09bab963326db17e7f3
      REBALANCED_SHA256: 2482a159c3108a7868123d7c2cac7a8a620fe537952fee0cda6024c6ea5c7c96
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download exact accepted artifact
        uses: actions/download-artifact@v4
        with:
          repository: NikichMods/PrayerClarity
          run-id: 36266833620
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: PrayerClarity-rebalanced-0.2.47-ci-6b3aa5399c8913d368f2b09bab963326db17e7f3
          path: accepted

      - name: Verify accepted bytes and stage canonical asset
        shell: bash
        run: |
          set -euo pipefail
          handed='accepted/PrayerClarity.Rebalanced-0.2.47-ci.dll'
          test -f "$handed"
          actual=$(sha256sum "$handed" | awk '{print $1}')
          test "$actual" = "$REBALANCED_SHA256"

          mkdir -p release
          cp "$handed" release/PrayerClarity.Rebalanced.dll
          test "$(sha256sum release/PrayerClarity.Rebalanced.dll | awk '{print $1}')" = "$REBALANCED_SHA256"

      - name: Publish Rebalanced 0.2.47 without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          if gh release view rebalanced-v0.2.47 --repo NikichMods/PrayerClarity >/dev/null 2>&1; then
            echo 'rebalanced-v0.2.47 already exists; leaving publication identity unchanged.'
          else
            gh release create rebalanced-v0.2.47 release/PrayerClarity.Rebalanced.dll \
              --repo NikichMods/PrayerClarity \
              --target "$ACCEPTED_SHA" \
              --title 'PrayerClarity: Rebalanced 0.2.47' \
              --latest=false \
              --notes "Accepted PrayerClarity: Rebalanced release for Graveyard Keeper 1.407. Repose presentation is now consistent across Technology, prayer items, the pulpit and Temporary Effects, including terminal progression states. Prayer-item tooltips use the game's native width, center the 100%-success requirement, and keep Base Result / On Success content visibly left-aligned. Prayer mechanics and the accepted Rebalanced balance roster are unchanged. Exact accepted runtime source: $ACCEPTED_SHA. Exact DLL SHA-256: $REBALANCED_SHA256."
          fi

      - name: Verify published release asset bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify
          mkdir verify
          gh release download rebalanced-v0.2.47 \
            --repo NikichMods/PrayerClarity \
            --pattern 'PrayerClarity.Rebalanced.dll' \
            --dir verify
          test -f verify/PrayerClarity.Rebalanced.dll
          test "$(sha256sum verify/PrayerClarity.Rebalanced.dll | awk '{print $1}')" = "$REBALANCED_SHA256"

          target=$(gh api repos/NikichMods/PrayerClarity/git/ref/tags/rebalanced-v0.2.47 --jq '.object.sha')
          test "$target" = "$ACCEPTED_SHA"
